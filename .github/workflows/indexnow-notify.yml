name: Notify search engines about Kazisafii page updates

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "**/index.html"
      - "sitemap.xml"

permissions:
  contents: read

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current site files and previous commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Prepare changed page URLs
        shell: bash
        run: |
          set -euo pipefail
          KEY_FILE="f72e341c05c04e8ea88cdbf8484d25d6.txt"
          test -f "$KEY_FILE"
          test -f "sitemap.xml"
          KEY="$(tr -d '\r\n' < "$KEY_FILE")"
          test -n "$KEY"
          export INDEXNOW_KEY="$KEY"
          git diff --name-only HEAD^ HEAD > /tmp/changed-files.txt
          python - <<'PY' > /tmp/indexnow-payload.json
          import json
          import os
          import subprocess
          import xml.etree.ElementTree as ET

          host = "kazisafii.co.ke"
          key = os.environ["INDEXNOW_KEY"]
          base = f"https://{host}"
          changed = set()

          with open("/tmp/changed-files.txt", encoding="utf-8") as stream:
              paths = [line.strip() for line in stream if line.strip()]

          # Notify URLs whose HTML page file was added, edited, renamed or removed.
          for path in paths:
              if path == "index.html":
                  changed.add(base + "/")
              elif path.endswith("/index.html"):
                  slug = path[:-len("/index.html")].strip("/")
                  if slug and "/" not in slug:
                      changed.add(f"{base}/{slug}/")

          # Also compare the old and new sitemap so URL additions, removals and
          # last-modified changes are notified even when only the sitemap changed.
          if "sitemap.xml" in paths:
              old = subprocess.run(
                  ["git", "show", "HEAD^:sitemap.xml"],
                  capture_output=True, text=True, check=True
              ).stdout
              new = open("sitemap.xml", encoding="utf-8").read()

              ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}

              def read_map(xml_text):
                  root = ET.fromstring(xml_text)
                  result = {}
                  for entry in root.findall("sm:url", ns):
                      loc = entry.findtext("sm:loc", default="", namespaces=ns).strip()
                      lastmod = entry.findtext("sm:lastmod", default="", namespaces=ns).strip()
                      if loc.startswith(base + "/"):
                          result[loc] = lastmod
                  return result

              before = read_map(old)
              after = read_map(new)
              for url in set(before) | set(after):
                  if before.get(url) != after.get(url):
                      changed.add(url)

          urls = sorted(changed)
          if not urls:
              print("No changed Kazisafii page URLs were found; no notification needed.")
              raise SystemExit(0)

          print(f"Preparing {len(urls)} changed page URL(s) for IndexNow.", file=__import__("sys").stderr)
          print(json.dumps({
              "host": host,
              "key": key,
              "keyLocation": f"{base}/{key}.txt",
              "urlList": urls
          }))
          PY
          if [[ ! -s /tmp/indexnow-payload.json ]]; then
            echo "No IndexNow payload was created; nothing to submit."
            exit 0
          fi
          status="$(curl --silent --show-error --output /tmp/indexnow-response.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow-payload.json \
            --max-time 30 \
            https://api.indexnow.org/indexnow)"
          echo "IndexNow HTTP status: $status"
          cat /tmp/indexnow-response.txt || true
          if [[ "$status" != "200" && "$status" != "202" ]]; then
            echo "IndexNow did not accept the submission."
            exit 1
          fi
