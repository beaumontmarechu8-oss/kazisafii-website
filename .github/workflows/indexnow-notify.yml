name: Notify search engines about Kazisafii page updates

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current sitemap and verification key
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Submit all sitemap URLs to IndexNow
        shell: bash
        run: |
          set -euo pipefail
          KEY_FILE="f72e341c05c04e8ea88cdbf8484d25d6.txt"
          test -f "$KEY_FILE"
          test -f "sitemap.xml"
          KEY="$(tr -d '\r\n' < "$KEY_FILE")"
          test -n "$KEY"
          export INDEXNOW_KEY="$KEY"
          python - <<'PY' > /tmp/indexnow-payload.json
          import json, os
          import xml.etree.ElementTree as ET

          key = os.environ["INDEXNOW_KEY"]
          tree = ET.parse("sitemap.xml")
          namespace = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [
              node.text.strip()
              for node in tree.findall(".//sm:url/sm:loc", namespace)
              if node.text and node.text.strip().startswith("https://kazisafii.co.ke/")
          ]
          if not urls:
              raise SystemExit("No Kazisafii URLs were found in sitemap.xml")
          print(json.dumps({
              "host": "kazisafii.co.ke",
              "key": key,
              "keyLocation": f"https://kazisafii.co.ke/{key}.txt",
              "urlList": urls,
          }))
          print(f"Prepared {len(urls)} sitemap URLs for IndexNow submission.", file=__import__("sys").stderr)
          PY
          status="$(curl --silent --show-error --output /tmp/indexnow-response.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow-payload.json \
            --max-time 30 \
            https://api.indexnow.org/indexnow)"
          echo "IndexNow HTTP status: $status"
          cat /tmp/indexnow-response.txt || true
          if [[ "$status" != "200" && "$status" != "202" ]]; then
            echo "IndexNow did not accept the submission."
            exit 1
          fi
